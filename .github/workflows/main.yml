name: Build debug APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q NexaToolkit.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/ | head -1)bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: NexaToolkit
        run: gradle assembleDebug --stacktrace
      - name: Unit tests
        working-directory: NexaToolkit
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: Debug build ${{ github.run_number }}
          files: NexaToolkit/app/build/outputs/apk/debug/app-debug.apk
